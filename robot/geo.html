<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>AutoAmigo · cálculo de rutas</title>
<meta name="robots" content="noindex">
<style>body{font:14px system-ui,sans-serif;margin:16px;color:#0B1030}pre{white-space:pre-wrap;word-break:break-word}</style></head>
<body>
<pre id="r">Calculando…</pre>
<script>
/*
 * Página de apoyo para el robot de WhatsApp (prueba). Hace EXACTAMENTE lo mismo que el panel:
 * busca lugares con el mismo buscador (Nominatim, Ecuador, alrededor de Guayaquil) y mide la
 * distancia por calle con el mismo servidor de rutas (OSRM). La tarifa usa la misma fórmula del panel.
 *   ?buscar=texto                 -> lugares encontrados
 *   ?o=texto&d=texto              -> cotización de origen a destino
 */
(function () {
  var CENTRO = [-2.1700, -79.9224];               // config.js: centroMapa
  var CFG = { arranqueC: 50, kmC: 50, minimaC: 250 };
  var p = new URLSearchParams(location.search);
  var out = document.getElementById('r');
  function fin(obj) { out.textContent = 'RESULTADO:' + JSON.stringify(obj) + '\nLISTO'; }
  function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function tarifaC(km) { return Math.max(CFG.minimaC, CFG.arranqueC + Math.floor(km * 10) * Math.round(CFG.kmC / 10)); }

  function buscar(q) {
    var vb = [CENTRO[1] - 0.4, CENTRO[0] + 0.4, CENTRO[1] + 0.4, CENTRO[0] - 0.4].join(',');
    var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=es&countrycodes=ec&viewbox=' + vb + '&q=' + encodeURIComponent(q);
    return fetch(url).then(function (r) { return r.json(); }).then(function (res) {
      return res.map(function (x) {
        return { nombre: x.display_name.split(',').slice(0, 3).join(',').trim(), lat: +(+x.lat).toFixed(6), lng: +(+x.lon).toFixed(6) };
      });
    });
  }
  // Si no encuentra el texto completo, prueba quitando palabras de ayuda ("vía a la costa", "cdla", "urb", etc.)
  function buscarFlexible(q) {
    var intentos = [q];
    var limpio = q.replace(/\b(v[ií]a a la costa|v[ií]a a samborond[oó]n|v[ií]a a daule|v[ií]a samborond[oó]n|km\s*\d+([.,]\d+)?|ciudadela|cdla\.?|urbanizaci[oó]n|urb\.?|sector|guayaquil|samborond[oó]n)\b/gi, ' ').replace(/\s+/g, ' ').trim();
    if (limpio && limpio.toLowerCase() !== q.toLowerCase()) intentos.push(limpio);
    var sinEspacios = limpio.replace(/\s+/g, '');
    if (sinEspacios.length > 4 && sinEspacios !== limpio) intentos.push(sinEspacios);
    var i = 0;
    function siguiente() {
      if (i >= intentos.length) return Promise.resolve([]);
      var t = intentos[i++];
      return buscar(t).then(function (r) { return r.length ? r : esperar(1100).then(siguiente); });
    }
    return siguiente();
  }
  function ruta(a, b) {
    var url = 'https://router.project-osrm.org/route/v1/driving/' + a.lng + ',' + a.lat + ';' + b.lng + ',' + b.lat + '?overview=false';
    return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      var m = j && j.routes && j.routes[0] && j.routes[0].distance;
      return typeof m === 'number' ? m / 1000 : null;
    });
  }

  var tarea;
  if (p.get('buscar')) {
    tarea = buscarFlexible(p.get('buscar')).then(function (r) { fin({ lugares: r }); });
  } else if (p.get('o') && p.get('d')) {
    var o, d;
    tarea = buscarFlexible(p.get('o')).then(function (r) { o = r; return esperar(1100); })
      .then(function () { return buscarFlexible(p.get('d')); }).then(function (r) {
        d = r;
        if (!o.length || !d.length) return fin({ error: 'no_encontrado', origen: o.length ? o[0] : null, destino: d.length ? d[0] : null });
        return ruta(o[0], d[0]).then(function (km) {
          if (km == null) return fin({ error: 'sin_ruta' });
          fin({ origen: o[0], destino: d[0], otros_origen: o.slice(1, 3), otros_destino: d.slice(1, 3),
                km: Math.round(km * 100) / 100, valorC: tarifaC(km), valor: '$' + (tarifaC(km) / 100).toFixed(2) });
        });
      });
  } else { fin({ error: 'sin_parametros' }); }
  tarea && tarea.catch(function (e) { fin({ error: 'fallo', detalle: String(e) }); });
})();
</script>
</body></html>
