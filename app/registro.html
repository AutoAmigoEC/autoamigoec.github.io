<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AutoAmigo · Crear usuario</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0A0F3C;--navy2:#141A52;--texto:#101828;--gris:#667085;--suave:#F2F4F7;--linea:#E4E7EC;--verde:#12B76A;--rojo:#E5252A}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fff;font-family:Inter,system-ui,sans-serif;color:var(--texto)}
  @keyframes entra{from{opacity:0}to{opacity:1}}
  @keyframes aparece{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  .aviso{position:fixed;left:18px;right:18px;bottom:24px;background:#101828;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;z-index:60;text-align:center}
  /* ---------- Verificación al empezar el turno ---------- */
  .verif{position:absolute;inset:0;z-index:55;background:#fff;display:flex;flex-direction:column;animation:entra .18s ease}
  .verif .vcab{flex:none;padding:44px 18px 10px;display:flex;align-items:center;gap:12px}
  .verif .vcab b{font-family:Manrope,sans-serif;font-size:19px;color:var(--navy);flex:1}
  .verif .vcab button{width:40px;height:40px;border-radius:12px;border:0;background:var(--suave);font-size:20px;cursor:pointer;color:var(--texto)}
  .verif .vprog{flex:none;display:flex;gap:6px;padding:0 18px}
  .verif .vprog i{flex:1;height:5px;border-radius:9px;background:#E4E7EC}
  .verif .vprog i.ok{background:var(--verde)}.verif .vprog i.ya{background:var(--navy)}
  .verif .vpaso{flex:none;padding:12px 18px 0;font-size:13px;font-weight:700;color:var(--gris)}
  .verif .vcuerpo{flex:1;overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:12px}
  .verif h2{margin:0;font-family:Manrope,sans-serif;font-size:22px;color:var(--texto);line-height:1.2}
  .verif p{margin:0;color:var(--gris);font-size:14.5px;line-height:1.45}
  .verif .cam{position:relative;border-radius:22px;overflow:hidden;background:#101828;aspect-ratio:3/4;max-height:52vh;flex:none;width:100%}
  .verif .cam.ancha{aspect-ratio:4/3}
  .verif .cam video,.verif .cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .verif .cam video.espejo{transform:scaleX(-1)}
  .verif .cam .ovalo{position:absolute;left:50%;top:44%;width:62%;aspect-ratio:3/4;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 0 999px rgba(10,15,60,.45);border:4px solid #fff;transition:border-color .3s}
  .verif .cam .ovalo.ok{border-color:var(--verde)}
  .verif .cam .marco{position:absolute;inset:12%;border:3px dashed rgba(255,255,255,.85);border-radius:18px}
  .verif .cam .indica{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(16,24,40,.78);color:#fff;border-radius:14px;padding:11px 12px;text-align:center;font-weight:800;font-size:16px}
  .verif .cam .marca{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;border-radius:8px;padding:4px 8px}
  .verif .reglas{display:flex;flex-wrap:wrap;gap:8px}
  .verif .reglas span{border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:700}
  .verif .reglas .si{background:#DCFAE6;color:#067647}.verif .reglas .no{background:#FDECEC;color:#B42318}
  .verif .vbtn{flex:none;height:58px;border:0;border-radius:16px;background:var(--navy);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer;width:100%}
  .verif .vbtn.claro{background:var(--suave);color:var(--texto)}
  .verif .vbtn:disabled{opacity:.5}
  .verif .fila2{display:flex;gap:10px}.verif .fila2 .vbtn{flex:1}
  .verif .fotos3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .verif .fotos3 button{aspect-ratio:3/4;border-radius:14px;border:2px dashed #B9C0D4;background:#F8F9FC;font:inherit;font-size:12px;font-weight:700;color:var(--gris);cursor:pointer;padding:6px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .verif .fotos3 button.sel{border:3px solid var(--navy);color:var(--navy)}
  .verif .fotos3 button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .verif .fotos3 button.hecha::after{content:'✓';position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;background:var(--verde);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
  .verif .compara{display:flex;align-items:center;gap:12px;justify-content:center}
  .verif .compara figure{margin:0;text-align:center;font-size:12px;color:var(--gris);font-weight:600}
  .verif .compara img{width:110px;height:140px;object-fit:cover;border-radius:16px;display:block;margin-bottom:6px;background:#E4E7EC}
  .verif .grande{width:86px;height:86px;border-radius:50%;margin:24px auto 6px;display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;background:var(--verde);animation:aparece .45s cubic-bezier(.2,1.4,.4,1)}
  .verif .grande.mal{background:var(--rojo)}.verif .grande.espera{background:var(--navy)}
  .verif .grande.espera::before{content:'';width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:gira .9s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .verif .centro{text-align:center}
  .verif .motivo{background:#FDECEC;color:#B42318;border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.4}
  .verif .soloprueba{border:2px dashed #F5B300;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#FFFBEB}
  .verif .soloprueba small{font-weight:800;color:#93370D;font-size:12px}
  .verif .soloprueba button{height:40px;border-radius:10px;border:1px solid #E4E7EC;background:#fff;font:inherit;font-weight:700;cursor:pointer}
  .verif .resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .verif .resumen figure{margin:0;font-size:11.5px;color:var(--gris);font-weight:600;text-align:center}
  .verif .resumen img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#E4E7EC;display:block;margin-bottom:3px}
  .verif .resumen .queda img{opacity:.45}
  .verif .resumen .sin-cara img{clip-path:inset(60% 0 0 0 round 0 0 12px 12px);background:repeating-linear-gradient(45deg,#E4E7EC 0 6px,#F2F4F7 6px 12px)}
  .verif .resumen .sin-cara{background:repeating-linear-gradient(45deg,#E4E7EC 0 6px,#F2F4F7 6px 12px) no-repeat top/100% 60%;border-radius:12px}
  .verif .vlista{border:1px solid #E4E7EC;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .verif .vlista b{font-size:15.5px}.verif .vlista p{font-size:13.5px;margin-top:2px}
  /* ---------- Inicio de sesión y Crear usuario ---------- */
  .registro{z-index:57}
  .acceso{flex:1;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;gap:18px;overflow:auto}
  .acceso .logo{width:92px;height:92px;border-radius:24px;background:#fff;padding:8px}
  .acceso .tarj{background:#fff;border-radius:24px;padding:22px 18px;width:100%;display:flex;flex-direction:column;gap:12px}
  .acceso h2{margin:0;font-family:Manrope,sans-serif;font-size:22px;color:var(--texto)}
  .acceso p{margin:0;color:var(--gris);font-size:14px}
  .acceso label,.registro .campo{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700;color:#344054}
  .acceso input,.registro .campo input{height:52px;border:1px solid #D0D5DD;border-radius:14px;padding:0 14px;font:inherit;font-size:16px;font-weight:500;color:var(--texto);background:#fff;width:100%}
  .registro .campo.mal input{border-color:var(--rojo);background:#FFF5F5}
  .registro .campo small{color:var(--rojo);font-weight:600;font-size:12.5px}
  .acceso .crear{width:100%;border:2px solid rgba(255,255,255,.35);background:transparent;color:#C9CDE6;border-radius:18px;padding:14px;font:inherit;font-size:13.5px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .acceso .crear b{color:#fff;font-size:16.5px}
  .registro .grupo-r{margin:10px 0 -2px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris)}
  .lista-fotos{display:flex;flex-direction:column;gap:10px}
  .fila-foto{display:flex;align-items:center;gap:12px;border:2px dashed #B9C0D4;border-radius:16px;background:#F8F9FC;padding:10px;text-align:left;font:inherit;cursor:pointer;position:relative}
  .fila-foto.hecha{border:2px solid var(--verde);background:#F0FDF5}
  .fila-foto img,.fila-foto .ic{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;background:#EEF0F4;font-size:24px}
  .fila-foto b{display:block;font-size:15px}.fila-foto small{color:var(--gris);font-size:12.5px;line-height:1.35}
  .fila-foto i{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--verde);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;flex:none}
  .doc-alerta{display:block;margin-top:6px;border:1px solid #FEDF89;background:#FFFAEB;color:#B54708;border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-align:left}
  .doc-alerta.mal{border-color:#FECDCA;background:#FEF3F2;color:#B42318}
  .verif{position:fixed}
</style>
</head>
<body>
<div class="verif registro" id="registro"></div>
<div class="aviso" id="aviso" hidden></div>
<script src="registro.js?v=1"></script>
</body>
</html>
