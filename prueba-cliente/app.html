<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#090145">
<title>AutoAmigo · App del cliente (prueba)</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--azul:#090145;--azul2:#1B1470;--rojo:#DE0B13;--texto:#0E0F1A;--gris:#6B7085;--gris2:#9AA0B4;--linea:#ECEDF3;--fondo:#F3F4F8;--verde:#0E9F6E}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#E9EAF2;font-family:Inter,system-ui,sans-serif;color:var(--texto)}
  [hidden]{display:none!important}
  button{font:inherit;color:inherit;cursor:pointer}
  .envoltura{min-height:100%;display:flex;align-items:center;justify-content:center;gap:28px;padding:18px;flex-wrap:wrap}
  .tel{position:relative;width:390px;height:820px;border-radius:44px;background:#000;padding:10px;box-shadow:0 30px 70px rgba(9,1,69,.25)}
  #pantalla{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#fff}
  @media (max-width:520px){
    .envoltura{padding:0;display:block}
    .tel{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none}
    #pantalla{border-radius:0}
    .controles{display:none}
    .controles.abierto{display:block;position:fixed;inset:70px 10px auto 10px;z-index:300;max-height:70vh;overflow:auto}
    #b-prueba{display:flex!important}
  }
  #mapa{position:absolute;inset:0}
  .maplibregl-ctrl-top-left,.maplibregl-ctrl-bottom-left{display:none}

  /* ---- Elementos flotantes ---- */
  .flotante{position:absolute;z-index:20;border:none;background:#fff;box-shadow:0 4px 14px rgba(9,1,69,.18)}
  .redondo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
  #b-volver{top:calc(14px + env(safe-area-inset-top,0px));left:14px}
  #b-centrar{right:14px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
  .aviso-top{position:absolute;z-index:25;top:calc(14px + env(safe-area-inset-top,0px));left:70px;right:14px;background:var(--azul);color:#fff;border-radius:14px;padding:11px 14px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(9,1,69,.3)}

  /* ---- Hoja inferior ---- */
  .hoja{position:absolute;left:0;right:0;bottom:0;z-index:30;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(9,1,69,.12);padding:8px 16px 14px;max-height:80%;overflow:auto;transition:bottom .25s}
  .con-tabs .hoja{bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .asa{width:40px;height:5px;border-radius:3px;background:#D9DCE6;margin:0 auto 12px}
  h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.015em}
  .sub{color:var(--gris);font-size:14px;margin:0 0 12px;line-height:1.4}
  .barra-busq{display:flex;align-items:center;gap:10px;background:var(--fondo);border-radius:999px;padding:6px 6px 6px 18px;width:100%;border:none;text-align:left}
  .barra-busq .t{flex:1;font-size:18px;font-weight:700}
  .ahora{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:9px 12px;font-weight:700;font-size:14px;border:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .atajos{display:flex;gap:10px;margin:12px 0 4px;overflow-x:auto}
  .atajo{display:flex;align-items:center;gap:8px;border:none;background:var(--fondo);border-radius:999px;padding:9px 14px 9px 10px;font-weight:700;font-size:14px;white-space:nowrap}
  .atajo .ic{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center}
  .lugar{display:flex;align-items:center;gap:14px;padding:12px 2px;border:none;background:none;width:100%;text-align:left}
  .lugar + .lugar{border-top:1px solid var(--linea)}
  .lugar .circ{width:40px;height:40px;border-radius:50%;background:var(--fondo);display:grid;place-items:center;flex:none}
  .lugar .tx{flex:1;min-width:0}
  .lugar b{display:block;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lugar small{display:block;color:var(--gris);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tarjeta-seg{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,#0B0F3C,#1B1470);color:#fff;border-radius:18px;padding:14px;margin-top:12px}
  .tarjeta-seg b{display:block;font-size:15px}
  .tarjeta-seg small{opacity:.8;font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
  .btn{width:100%;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:17px;background:var(--azul);color:#fff}
  .btn:disabled{opacity:.4}
  .btn.sec{background:var(--fondo);color:var(--texto)}
  .btn.peligro{background:var(--fondo);color:var(--rojo)}
  .fila{display:flex;gap:10px}
  .fila>*{flex:1}

  /* ---- Barra de pestañas ---- */
  .tabs{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--linea);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab{flex:1;border:none;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--gris2)}
  .tab.on{color:var(--texto)}
  .tab svg{width:24px;height:24px}

  /* ---- Pantallas completas ---- */
  .pantalla{position:absolute;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  .con-tabs .pantalla.tabbed{bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .pantalla .cab{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
  .pantalla .cab b{font-size:18px}
  .pantalla .tit{font-size:30px;font-weight:800;letter-spacing:-.02em;padding:18px 18px 8px}
  .cuerpo{flex:1;overflow:auto;padding:0 18px 24px}
  .ir-atras{width:40px;height:40px;border-radius:50%;border:none;background:var(--fondo);display:grid;place-items:center}
  .campos{margin:6px 14px 8px;display:grid;grid-template-columns:22px 1fr;column-gap:10px;align-items:center}
  .campos .linea-v{grid-row:1/3;justify-self:center;display:flex;flex-direction:column;align-items:center;height:100%;padding:14px 0}
  .campos .linea-v i{width:9px;height:9px;border-radius:50%;background:var(--texto)}
  .campos .linea-v span{flex:1;width:2px;background:var(--texto);margin:4px 0}
  .campos .linea-v b{width:9px;height:9px;background:var(--texto)}
  .campos input{border:none;background:var(--fondo);border-radius:10px;font:inherit;font-size:16px;padding:12px;outline:none;width:100%;color:var(--texto);margin:3px 0}
  .campos input:focus{background:#E9EAF1;box-shadow:inset 0 0 0 2px var(--texto)}
  .op-mapa{display:flex;align-items:center;gap:14px;padding:12px 16px;border:none;background:none;width:100%;text-align:left;font-weight:700;border-top:6px solid var(--fondo)}

  /* ---- Elegir viaje ---- */
  .opcion{display:flex;align-items:center;gap:12px;border:2px solid var(--texto);border-radius:16px;padding:10px 12px;margin:2px 0 10px}
  .opcion .carro{width:74px;flex:none}
  .opcion .tx{flex:1;min-width:0}
  .opcion .tx b{font-size:17px;display:flex;align-items:center;gap:6px}
  .opcion .tx small{display:block;color:var(--gris);font-size:13px;margin-top:2px}
  .opcion .precio{text-align:right;font-weight:800;font-size:18px}
  .opcion .precio small{display:block;font-weight:500;color:var(--gris);font-size:11.5px}
  .pago{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;padding:10px 2px;border-top:1px solid var(--linea);margin-bottom:10px}
  .pago .flecha{margin-left:auto;color:var(--gris2)}
  .entrada{width:100%;border:none;background:var(--fondo);border-radius:12px;padding:13px 14px;font:inherit;font-size:15px;margin-bottom:10px;outline:none}
  .entrada:focus{box-shadow:inset 0 0 0 2px var(--texto)}
  .direccion{display:flex;align-items:center;gap:12px;background:var(--fondo);border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .direccion b{flex:1;min-width:0;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- Etiquetas en el mapa ---- */
  .etq{display:flex;align-items:stretch;background:var(--texto);color:#fff;border-radius:8px;font-size:13px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.25);white-space:nowrap;transform:translateY(-6px)}
  .etq .n{background:#fff;color:var(--texto);border-radius:6px;margin:3px;padding:3px 7px;display:flex;flex-direction:column;align-items:center;line-height:1.05;font-size:15px}
  .etq .n small{font-size:9.5px;font-weight:700}
  .etq .t{padding:8px 10px;display:flex;align-items:center;gap:4px}
  .punto-o{width:16px;height:16px;border-radius:50%;background:var(--texto);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .punto-d{width:16px;height:16px;background:var(--texto);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .yo-mk{width:18px;height:18px;border-radius:50%;background:#1570EF;border:3px solid #fff;box-shadow:0 0 0 8px rgba(21,112,239,.18)}
  .carro-mk{width:34px;height:34px;transition:transform .9s linear}
  .radar{width:24px;height:24px;position:relative}
  .radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--azul);opacity:.3;animation:radar 2s ease-out infinite}
  .radar::after{animation-delay:1s}
  .radar i{position:absolute;inset:4px;border-radius:50%;background:var(--azul);border:3px solid #fff}
  @keyframes radar{from{transform:scale(1);opacity:.4}to{transform:scale(11);opacity:0}}
  .pin-centro{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);z-index:15;pointer-events:none;display:flex;flex-direction:column;align-items:center}
  .pin-centro .burbuja{background:var(--texto);color:#fff;font-weight:700;font-size:13px;border-radius:8px;padding:7px 10px;margin-bottom:6px;white-space:nowrap}

  /* ---- Buscando ---- */
  .progreso{height:4px;border-radius:2px;background:var(--fondo);overflow:hidden;margin:8px 0 14px}
  .progreso i{display:block;height:100%;width:30%;background:var(--azul);border-radius:2px;animation:prog 1.3s ease-in-out infinite}
  @keyframes prog{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
  .ruta-mini{display:grid;grid-template-columns:20px 1fr;column-gap:10px;row-gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--linea)}
  .ruta-mini i{width:9px;height:9px;border-radius:50%;background:var(--texto);justify-self:center}
  .ruta-mini b{width:9px;height:9px;background:var(--texto);justify-self:center}
  .ruta-mini span{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- Conductor ---- */
  .cab-viaje{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .cab-viaje h2{font-size:20px;margin:0}
  .cab-viaje .min{background:var(--azul);color:#fff;border-radius:10px;padding:7px 10px;font-weight:800;font-size:15px;white-space:nowrap}
  .cond{display:flex;align-items:center;gap:12px}
  .foto{position:relative;width:62px;height:62px;flex:none}
  .foto .av{width:62px;height:62px;border-radius:50%;background:linear-gradient(140deg,#2A2190,#090145);color:#fff;display:grid;place-items:center;font-weight:800;font-size:21px}
  .foto .est{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:2px 7px;font-size:12px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.2);white-space:nowrap}
  .cond .tx{flex:1;min-width:0}
  .cond .tx .nom{font-size:15px;color:var(--gris);font-weight:600}
  .cond .tx .placa{font-size:24px;font-weight:800;letter-spacing:.03em;line-height:1.1}
  .cond .tx small{display:block;color:var(--gris);font-size:13px;margin-top:2px}
  .cond .auto{width:96px;flex:none}
  .msj{display:flex;gap:10px;margin:16px 0 12px}
  .msj button.caja{flex:1;border:none;background:var(--fondo);border-radius:999px;padding:13px 16px;text-align:left;color:var(--gris);font-size:15px}
  .circulo{width:48px;height:48px;border-radius:50%;border:none;background:var(--fondo);display:grid;place-items:center;flex:none}
  .opciones-viaje{border-top:6px solid var(--fondo);margin:4px -16px 0;padding:4px 16px 0}
  .op{display:flex;align-items:center;gap:14px;padding:13px 0;border:none;background:none;width:100%;text-align:left;font-size:15px;font-weight:600}
  .op + .op{border-top:1px solid var(--linea)}
  .op small{display:block;color:var(--gris);font-weight:500;font-size:13px;margin-top:2px}
  .op.rojo{color:var(--rojo)}
  .taxim{display:flex;justify-content:space-between;align-items:center;background:var(--fondo);border-radius:16px;padding:12px 14px;margin:14px 0 4px}
  .taxim small{display:block;color:var(--gris);font-size:11px;font-weight:700;letter-spacing:.06em}
  .taxim b{font-size:24px}

  .taxi{margin-top:14px;background:#E6EEFF;border-radius:18px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .taxi .t{color:#1A5CE0;font-weight:800;font-size:13px;letter-spacing:.4px}
  .taxi .i{color:#475467;font-size:13.5px;margin-top:3px;line-height:1.45}
  .taxi .v{color:#1A5CE0;font-weight:800;font-size:34px;letter-spacing:-.8px}
  .filas{border:1px solid var(--linea);border-radius:16px;padding:4px 14px;margin:6px 0 14px}
  .filas .fila{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14px}
  .filas .fila + .fila{border-top:1px solid var(--linea)}
  .filas .fila span{color:var(--gris)}
  .filas .fila b{text-align:right}
  .nota-min{background:#FFF6E5;color:#93370D;border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 10px;line-height:1.4}
  /* ---- Fin ---- */
  .total{text-align:center;padding:4px 0 10px}
  .total b{display:block;font-size:44px;font-weight:800;letter-spacing:-.02em}
  .estrellas{display:flex;justify-content:center;gap:6px;margin:8px 0 12px}
  .estrellas button{border:none;background:none;padding:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
  .chip{border:none;background:var(--fondo);border-radius:999px;padding:9px 13px;font-size:13.5px;font-weight:700}
  .chip.on{background:var(--texto);color:#fff}

  /* ---- Actividad y cuenta ---- */
  .viaje{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--linea)}
  .viaje .mini{width:64px;height:64px;border-radius:12px;background:var(--fondo);flex:none;display:grid;place-items:center}
  .viaje .tx{flex:1;min-width:0}
  .viaje .tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .viaje .tx small{display:block;color:var(--gris);font-size:13px;margin-top:3px}
  .viaje .rep{align-self:center;border:none;background:var(--fondo);border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px}
  .perfil-cab{display:flex;align-items:center;justify-content:space-between;padding:6px 0 18px}
  .perfil-cab b{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .perfil-cab .av{width:58px;height:58px;border-radius:50%;background:linear-gradient(140deg,#2A2190,#090145);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
  .cuadros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .cuadro{border:none;background:var(--fondo);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13px}
  .item{display:flex;align-items:center;gap:16px;padding:15px 2px;border:none;background:none;width:100%;text-align:left;font-size:16px;font-weight:600}
  .item small{display:block;color:var(--gris);font-weight:500;font-size:13px}

  /* ---- Ingreso ---- */
  .ingreso{position:absolute;inset:0;z-index:100;background:var(--azul);color:#fff;display:flex;flex-direction:column;padding:30px 24px calc(28px + env(safe-area-inset-bottom,0px))}
  .ingreso .logo{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:auto 0 0}
  .ingreso .logo span{color:var(--rojo)}
  .ingreso .lema{font-size:18px;opacity:.85;margin:6px 0 auto}
  .ingreso label{font-size:13px;font-weight:700;opacity:.8}
  .ingreso input{width:100%;border:none;border-radius:12px;padding:15px;font:inherit;font-size:16px;margin:6px 0 14px;color:var(--texto)}
  .ingreso .btn{background:#fff;color:var(--azul)}
  .ingreso .legal{font-size:12px;opacity:.6;text-align:center;margin-top:12px}

  /* ---- Modales y chat ---- */
  .modal{position:absolute;inset:0;z-index:150;background:rgba(9,1,69,.45);display:flex;align-items:flex-end}
  .modal .caja{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
  .chat{position:absolute;inset:0;z-index:120;background:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  .chat .msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--fondo)}
  .chat .m{max-width:78%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.35}
  .chat .m.yo{align-self:flex-end;background:var(--azul);color:#fff;border-bottom-right-radius:4px}
  .chat .m.el{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
  .chat .rapidas{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 0}
  .chat .pie{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
  .chat .pie input{flex:1;border:none;background:var(--fondo);border-radius:999px;padding:13px 16px;font:inherit;font-size:15px;outline:none}
  .toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:200;background:var(--texto);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;max-width:88%;text-align:center}


  /* ---- Animación de entrada ---- */
  .splash{position:absolute;inset:0;z-index:400;background:#090145;display:grid;place-items:center;overflow:hidden;animation:spFuera .45s ease 2.55s forwards}
  .splash .marca{font-size:40px;font-weight:800;letter-spacing:-.03em;color:#fff;animation:spMarca 1.5s cubic-bezier(.6,0,.2,1) forwards}
  .splash .marca span{color:#DE0B13}
  .splash .forma{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;background:#fff;border-radius:9px;opacity:0;animation:spForma 1.2s cubic-bezier(.5,0,.2,1) 1.05s forwards}
  .splash .forma::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#090145;transform:scale(0);animation:spHueco .3s ease 1.75s forwards}
  .splash .onda{position:absolute;left:50%;top:50%;width:22px;height:8px;margin:20px 0 0 -11px;border-radius:50%;border:2px solid rgba(222,11,19,.7);opacity:0;animation:spOnda .8s ease-out 2.05s forwards}
  @keyframes spMarca{0%{transform:scale(.92);opacity:0}18%{transform:scale(1);opacity:1}62%{transform:scale(1);opacity:1;filter:blur(0)}100%{transform:scale(.08);opacity:0;filter:blur(3px)}}
  @keyframes spForma{0%{opacity:0;transform:scale(.3) rotate(0)}22%{opacity:1;transform:scale(1) rotate(0);border-radius:9px;background:#fff}
    58%{transform:translateY(-34px) rotate(-45deg) scale(1.15);border-radius:50% 50% 50% 0;background:#DE0B13}
    80%{transform:translateY(-4px) rotate(-45deg) scale(1.15);border-radius:50% 50% 50% 0;background:#DE0B13}
    90%{transform:translateY(-10px) rotate(-45deg) scale(1.15);border-radius:50% 50% 50% 0;background:#DE0B13}
    100%{opacity:1;transform:translateY(-6px) rotate(-45deg) scale(1.15);border-radius:50% 50% 50% 0;background:#DE0B13}}
  @keyframes spHueco{to{transform:scale(1)}}
  @keyframes spOnda{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(5)}}
  @keyframes spFuera{to{opacity:0;visibility:hidden}}
  @media (prefers-reduced-motion:reduce){.splash,.splash *{animation-duration:.01s!important;animation-delay:0s!important}}
  /* ---- Esqueleto mientras carga ---- */

  function pararSim() { if (S.anim) cancelAnimationFrame(S.anim); S.anim = null; clearTimeout(S.tAcepta); clearTimeout(S.tChat); }
  function animarEnRuta(coords, seg, alAvanzar, alTerminar) {
    var largo = [0]; for (var i = 1; i < coords.length; i++) largo.push(largo[i - 1] + Math.hypot(coords[i][0] - coords[i - 1][0], coords[i][1] - coords[i - 1][1]));
    var total = largo[largo.length - 1] || 1, t0 = performance.now();
    function paso(t) {
      var k = Math.min(1, (t - t0) / (seg * 1000)), d = k * total, j = 1;
      while (j < largo.length - 1 && largo[j] < d) j++;
      var a = coords[j - 1], b = coords[j], f = (d - largo[j - 1]) / ((largo[j] - largo[j - 1]) || 1);
      var p = { lng: a[0] + (b[0] - a[0]) * f, lat: a[1] + (b[1] - a[1]) * f };
      poner(mC, p); mC.el.firstChild.style.transform = 'rotate(' + (Math.atan2(b[0] - a[0], b[1] - a[1]) * 180 / Math.PI) + 'deg)';
      alAvanzar && alAvanzar(k, [[p.lng, p.lat]].concat(coords.slice(j)));
      if (k < 1) S.anim = requestAnimationFrame(paso); else { S.anim = null; alTerminar && alTerminar(); }
    }
    S.anim = requestAnimationFrame(paso);
  }
  function actualizarMin(m) {
    if (m === S.minRest) return; S.minRest = m;
    var a = $('#min-viaje'), b = $('#tit-viaje');
    if (a) a.textContent = m + ' min';
    if (b) b.textContent = S.fase === 'viaje' ? 'Llegas a las ' + horaTxt(Date.now() + m * 60000) : 'Llega en ' + m + ' min';
  }
  function aceptar() {
    if (S.fase !== 'buscando') return;
    pararSim(); poner(mR, null); poner(mO, S.recogida);
    S.cond = CONDUCTORES[Math.floor(Math.random() * CONDUCTORES.length)];
    var ang = Math.random() * Math.PI * 2, ini = { lat: S.recogida.lat + Math.sin(ang) * 0.012, lng: S.recogida.lng + Math.cos(ang) * 0.012 };
    S.fase = 'encamino'; S.minRest = 4; render(); avisoTop(S.cond.nombre.split(' ')[0] + ' aceptó tu viaje');
    setTimeout(function () { if (S.fase === 'encamino') avisoTop(''); }, 3500);
    calcularRuta(ini, S.recogida).catch(function () { return { coords: [[ini.lng, ini.lat], [S.recogida.lng, S.recogida.lat]], min: 4 }; }).then(function (r) {
      if (S.fase !== 'encamino') return;
      var mins = Math.min(12, Math.max(2, r.min || 4)); actualizarMin(mins);
      encuadrar([ini, S.recogida]);
      animarEnRuta(r.coords, 30, function (k, resto) {
        linea(resto, 'r-cond', '#0E0F1A', 4);
        actualizarMin(Math.max(1, Math.ceil(mins * (1 - k))));
      }, llego);
    });
  }
  function llego() {
    if (S.fase !== 'encamino') return; pararSim();
    poner(mC, S.recogida); linea(null, 'r-cond', '#0E0F1A', 4);
    S.fase = 'llego'; render(); avisoTop('Tu AutoAmigo te espera afuera');
    if (navigator.vibrate) try { navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  // Viaje: el taxímetro avanza igual que en la app del conductor (metros recorridos + tiempo detenido,
  // los primeros segundos gratis, mínimo a cobrar). En la app real estos datos llegan del teléfono del conductor.
  function iniciar() {
    if (S.fase !== 'llego' && S.fase !== 'encamino') return; pararSim(); avisoTop('');
    poner(mO, null); linea(null, 'r-cond', '#0E0F1A', 4);
    var coords = S.ruta && S.ruta.coords ? S.ruta.coords : [[S.recogida.lng, S.recogida.lat], [S.destino.lng, S.destino.lat]];
    var largo = [0]; for (var i = 1; i < coords.length; i++) largo.push(largo[i - 1] + Math.hypot(coords[i][0] - coords[i - 1][0], coords[i][1] - coords[i - 1][1]));
    var total = largo[largo.length - 1] || 1, metrosRuta = (S.km || 1) * 1000;
    var REAL_MOV = 40, escala = Math.max(1, (S.min || 10) * 60 / REAL_MOV);        // segundos simulados por segundo real
    var paradas = [0.22, 0.5, 0.78].map(function (k) { return { k: k, real: 2 + Math.random() * 2, hecha: false }; });
    S.tx = { metros: 0, espera: 0, seg: 0, mostradoC: 0, parado: false, inicio: Date.now() };
    S.fase = 'viaje'; S.minRest = S.min; render(); encuadrar([S.recogida, S.destino]);
    var k = 0, ultimo = performance.now(), paradaHasta = 0;
    function paso(ahora) {
      var dt = Math.min(0.1, (ahora - ultimo) / 1000); ultimo = ahora;
      var t = S.tx, simDt = dt * escala;
      t.seg += simDt;
      var detenido = ahora < paradaHasta;
      if (!detenido) {
        var p = paradas.filter(function (x) { return !x.hecha && k >= x.k; })[0];
        if (p) { p.hecha = true; paradaHasta = ahora + p.real * 1000; detenido = true; }
      }
      if (!detenido) {
        var dk = dt / REAL_MOV; k = Math.min(1, k + dk);
        if (t.seg > CFG.gratisSeg) t.metros += dk * metrosRuta;
      } else if (t.seg > CFG.gratisSeg) t.espera += simDt;
      t.parado = detenido;
      t.mostradoC = t.seg < 3 ? 0 : taximetroC(t.metros, t.espera);
      // carro en el mapa
      var d = k * total, j = 1; while (j < largo.length - 1 && largo[j] < d) j++;
      var a = coords[j - 1], b = coords[j], f = (d - largo[j - 1]) / ((largo[j] - largo[j - 1]) || 1);
      var pos = { lng: a[0] + (b[0] - a[0]) * f, lat: a[1] + (b[1] - a[1]) * f };
      poner(mC, pos); mC.el.firstChild.style.transform = 'rotate(' + (Math.atan2(b[0] - a[0], b[1] - a[1]) * 180 / Math.PI) + 'deg)';
      linea([[pos.lng, pos.lat]].concat(coords.slice(j)), 'r-viaje', '#0E0F1A', 5);
      var e = $('#taxi'); if (e) e.innerHTML = taxiHTML();
      actualizarMin(Math.max(1, Math.ceil((S.min || 1) * (1 - k))));
      if (k < 1) S.anim = requestAnimationFrame(paso); else { S.anim = null; terminar(); }
    }
    S.anim = requestAnimationFrame(paso);
  }
  function terminar() {
    if (S.fase !== 'viaje') return; pararSim();
    var t = S.tx; t.fin = Date.now(); t.marcadoC = taximetroC(t.metros, t.espera);
    S.totalC = Math.max(CFG.minimaC, t.marcadoC); S.fase = 'fin'; S.est = 0; S.tags = {};
    poner(mC, S.destino); linea(null, 'r-viaje', '#0E0F1A', 5); avisoTop(''); render();
    S.viajes.unshift({ t: Date.now(), o: { nombre: S.recogida.nombre, lat: S.recogida.lat, lng: S.recogida.lng }, d: { nombre: S.destino.nombre, lat: S.destino.lat, lng: S.destino.lng }, totalC: S.totalC, cond: S.cond.nombre + ' · U' + S.cond.u });
    guardar('aac_viajes', S.viajes.slice(0, 40));
  }
  function cancelar() {
    modal('<h2>¿Quieres cancelar tu viaje?</h2><p class="sub">' + (S.fase === 'buscando' ? 'Todavía no hay una unidad asignada.' : esc(S.cond.nombre.split(' ')[0]) + ' ya va en camino hacia ti.') + '</p>' +
      '<div class="fila"><button class="btn sec" id="m-no">Mantener viaje</button><button class="btn" style="background:var(--rojo)" id="m-si">Cancelar viaje</button></div>');
  }

  // ---------- Chat con el conductor (simulado) ----------
  var RAPIDAS = ['Ya salgo', 'Estoy afuera', 'Estoy en la garita', 'Espérame 2 minutos'];
  function abrirChat() {
    $('#chat').hidden = false; $('#chat-nom').textContent = S.cond.nombre; $('#chat-sub').textContent = S.cond.carro + ' · ' + S.cond.placa;
    $('#chat-rapidas').innerHTML = RAPIDAS.map(function (t) { return '<button class="chip" data-rapida="' + esc(t) + '">' + esc(t) + '</button>'; }).join('');
    pintarChat();
  }
  function pintarChat() {
    var m = $('#chat-msgs');
    m.innerHTML = (S.chat.length ? '' : '<p class="sub" style="text-align:center;margin:20px 0">Escríbele a ' + esc(S.cond.nombre.split(' ')[0]) + '. Tu número no se comparte.</p>') +
      S.chat.map(function (x) { return '<div class="m ' + x.de + '">' + esc(x.t) + '</div>'; }).join('');
    m.scrollTop = m.scrollHeight;
  }
  function enviarChat(t) {
    t = String(t || '').trim(); if (!t) return;
    S.chat.push({ de: 'yo', t: t }); $('#chat-in').value = ''; pintarChat();
    clearTimeout(S.tChat);
    S.tChat = setTimeout(function () { S.chat.push({ de: 'el', t: S.fase === 'llego' ? 'Listo, aquí le espero 👍' : 'Listo, voy en camino 👍' }); pintarChat(); }, 1800);
  }

  // ---------- Modales de opciones ----------
  function modalAhora() {
    var d = new Date(Date.now() + 30 * 60000); d.setSeconds(0, 0); d.setMinutes(Math.ceil(d.getMinutes() / 5) * 5);
    var v = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    modal('<h2>¿Cuándo quieres tu viaje?</h2><p class="sub">Puedes programarlo hasta con 7 días de anticipación.</p>' +
      '<button class="lugar" id="m-ahora"><span class="circ">' + ICONO.reloj + '</span><span class="tx"><b>Ahora</b><small>Te enviamos la unidad más cercana</small></span></button>' +
      '<label class="sub" for="m-fecha" style="display:block;margin:12px 0 6px">Programar para</label><input class="entrada" type="datetime-local" id="m-fecha" value="' + v + '">' +
      '<button class="btn" id="m-programar">Programar</button>');
  }
  function modalSeguridad() {
    modal('<h2>Seguridad</h2><p class="sub">Tu viaje está registrado en la central de AutoAmigo.</p>' +
      '<button class="op" data-acc="compartir">' + ICONO.compartir + '<span>Compartir el estado del viaje<small>Envía un enlace con tu ubicación en vivo</small></span></button>' +
      '<button class="op" data-acc="central">' + ICONO.tel + '<span>Llamar a la central de AutoAmigo<small>Atención las 24 horas</small></span></button>' +
      '<button class="op rojo" data-acc="911"><svg width="20" height="20" viewBox="0 0 24 24" fill="#DE0B13"><circle cx="12" cy="12" r="10"/><path d="M11 7h2v6h-2zM11 15h2v2h-2z" fill="#fff"/></svg><span>Llamar al 911<small>Emergencias</small></span></button>');
  }
  function modalCuenta(k) {
    var p = S.perfil;
    if (k === 'perfil') modal('<h2>Mi perfil</h2><label class="sub" for="p-nombre" style="display:block;margin:10px 0 6px">Nombre</label><input class="entrada" id="p-nombre" value="' + esc(p.nombre) + '">' +
      '<label class="sub" for="p-tel" style="display:block;margin:0 0 6px">Celular</label><input class="entrada" id="p-tel" inputmode="tel" value="' + esc(p.tel) + '"><button class="btn" id="b-guardar-perfil">Guardar</button>');
    if (k === 'lugares') modal('<h2>Lugares guardados</h2><button class="lugar" data-atajo-editar="casa"><span class="circ">' + ICONO.casa + '</span><span class="tx"><b>Casa</b><small>' + esc(S.casa ? S.casa.nombre : 'Agregar') + '</small></span></button>' +
      '<button class="lugar" data-atajo-editar="trabajo"><span class="circ">' + ICONO.trabajo + '</span><span class="tx"><b>Trabajo</b><small>' + esc(S.trabajo ? S.trabajo.nombre : 'Agregar') + '</small></span></button>');
    if (k === 'tarifa') modal('<h2>Tarifa y pago</h2><p class="sub">Todas las carreras van con taxímetro:</p><p style="line-height:1.7;margin:0 0 14px">Arranque: <b>$0.50</b><br>Cada 100 metros: <b>$0.05</b> ($0.50 por km)<br>Cada 30 segundos de espera: <b>$0.05</b><br>Carrera mínima: <b>$2.50</b></p><div class="pago">' + ICONO.efectivo + 'Pago en efectivo al conductor</div>');
    if (k === 'ayuda') modal('<h2>Ayuda</h2><p class="sub">¿Tuviste un problema con un viaje u olvidaste algo en la unidad?</p><button class="btn" data-acc="central" style="margin-bottom:10px">Llamar a la central</button><button class="btn sec" data-acc="central-wa">Escribir por WhatsApp</button>');
    if (k === 'seguridad') modalSeguridad();
  }

  // ---------- Eventos ----------
  document.addEventListener('click', function (e) {
    var t = e.target, b;
    if ((b = t.closest('[data-tab]'))) { cerrarModal(); irTab(b.dataset.tab); return; }
    if (t.closest('#b-ahora')) { e.stopPropagation(); modalAhora(); return; }
    if (t.closest('#m-ahora')) { S.programada = null; cerrarModal(); render(); return; }
    if (t.closest('#m-programar')) {
      var v = new Date($('#m-fecha').value).getTime();
      if (!v || v < Date.now() + 15 * 60000) { toast('Elige una hora con al menos 15 minutos de anticipación.'); return; }
      S.programada = v; cerrarModal(); render(); toast('Programado para las ' + horaTxt(v) + '. Ahora elige tu destino.'); return;
    }
    if (t.closest('#b-buscar')) { abrirBusqueda('destino'); return; }
    if ((b = t.closest('[data-atajo]'))) { var k = b.dataset.atajo; if (S[k]) { S.destino = S[k]; irElegir(); } else abrirBusqueda('destino', k); return; }
    if ((b = t.closest('[data-atajo-editar]'))) { cerrarModal(); abrirBusqueda('destino', b.dataset.atajoEditar); return; }
    if ((b = t.closest('[data-rec]'))) { S.destino = recientes()[+b.dataset.rec]; irElegir(); return; }
    if ((b = t.closest('[data-repetir]'))) { var v2 = S.viajes[+b.dataset.repetir]; irTab('inicio'); S.destino = v2.d; irElegir(); return; }
    if (t.closest('#b-cerrar-busq')) { $('#busqueda').hidden = true; S.guardarComo = null; return; }
    if ((b = t.closest('[data-res]'))) { elegirLugar(S.lista[+b.dataset.res]); return; }
    if (t.closest('#b-fijar')) { fijar(S.buscando === 'recogida' ? 'recogida' : 'destino'); return; }
    if (t.closest('#b-confirmar-fijar')) { confirmarFijar(); return; }
    if (t.closest('#b-volver')) { if (S.fase === 'recogida') irElegir(); else irInicio(); return; }
    if (t.closest('#b-centrar')) { encuadrar([S.yo], 16); return; }
    if (t.closest('#b-elegir')) { irRecogida(); return; }
    if (t.closest('#b-confirmar-recogida')) { confirmarRecogida(); return; }
    if (t.closest('#b-cancelar')) { cancelar(); return; }
    if (t.closest('#m-no')) { cerrarModal(); return; }
    if (t.closest('#m-si')) { cerrarModal(); irInicio(); toast('Viaje cancelado.'); return; }
    if (t.closest('#modal') && !t.closest('.caja')) { cerrarModal(); return; }
    if (t.closest('#b-chat')) { abrirChat(); return; }
    if (t.closest('#b-cerrar-chat')) { $('#chat').hidden = true; return; }
    if (t.closest('#chat-env')) { enviarChat($('#chat-in').value); return; }
    if ((b = t.closest('[data-rapida]'))) { enviarChat(b.dataset.rapida); return; }
    if ((b = t.closest('[data-acc]'))) {
      var a = b.dataset.acc;
      if (a === 'seguridad') { modalSeguridad(); return; }
      cerrarModal();
      if (a === 'llamar') toast('Llamando a ' + S.cond.nombre.split(' ')[0] + '… (en la app real abre el teléfono)');
      if (a === 'compartir') toast('En la app real se envía un enlace para ver tu viaje en vivo.');
      if (a === 'central') toast('En la app real llama a la central.');
      if (a === 'central-wa') toast('En la app real abre WhatsApp con la central.');
      if (a === '911') toast('En la app real llama al 911.');
      return;
    }
    if ((b = t.closest('[data-cuenta]'))) { modalCuenta(b.dataset.cuenta); return; }
    if (t.closest('#b-guardar-perfil')) { S.perfil = { nombre: $('#p-nombre').value.trim() || S.perfil.nombre, tel: $('#p-tel').value.trim() || S.perfil.tel }; guardar('aac_perfil', S.perfil); cerrarModal(); pintarCuenta(); toast('Datos guardados.'); return; }
    if (t.closest('#b-salir')) { S.perfil = null; guardar('aac_perfil', null); $('#ingreso').hidden = false; return; }
    if ((b = t.closest('[data-est]'))) { S.est = +b.dataset.est; S.tags = {}; render(); return; }
    if ((b = t.closest('[data-tag]'))) { S.tags[b.dataset.tag] = !S.tags[b.dataset.tag]; render(); return; }
    if (t.closest('#b-terminar')) { toast('¡Gracias por viajar con AutoAmigo!'); S.programada = null; irInicio(); return; }
    if (t.closest('#b-ingresar')) {
      var n = $('#ing-nombre').value.trim(), tel = $('#ing-tel').value.replace(/\D/g, '');
      if (n.length < 3) { toast('Escribe tu nombre y apellido.'); return; }
      if (!/^09\d{8}$/.test(tel)) { toast('Escribe tu celular de 10 dígitos (empieza con 09).'); return; }
      S.perfil = { nombre: n, tel: tel }; guardar('aac_perfil', S.perfil); $('#ingreso').hidden = true; irInicio(); return;
    }
    if ((b = t.closest('[data-sim]'))) {
      var s = b.dataset.sim; $('#controles').classList.remove('abierto');
      if (s === 'acepta') { if (S.fase === 'buscando') aceptar(); else toast('Primero pide un viaje.'); }
      if (s === 'llego') { if (S.fase === 'encamino') llego(); else toast('Funciona cuando la unidad va en camino.'); }
      if (s === 'inicia') { if (S.fase === 'llego' || S.fase === 'encamino') iniciar(); else toast('Funciona cuando la unidad llegó.'); }
      if (s === 'fin') { if (S.fase === 'viaje') terminar(); else toast('Funciona durante el viaje.'); }
      if (s === 'reiniciar') { ['aac_perfil', 'aac_viajes', 'aac_casa', 'aac_trabajo'].forEach(function (k) { guardar(k, null); }); location.reload(); }
      return;
    }
    if (t.closest('#b-prueba')) { $('#controles').classList.toggle('abierto'); return; }
  });
  $('#in-origen').addEventListener('input', alEscribir);
  $('#in-destino').addEventListener('input', alEscribir);
  $('#in-origen').addEventListener('focus', function () { S.buscando = 'recogida'; });
  $('#in-destino').addEventListener('focus', function () { S.buscando = 'destino'; });
  $('#chat-in').addEventListener('keydown', function (e) { if (e.key === 'Enter') enviarChat(e.target.value); });
  window.addEventListener('resize', posBoton);

  // ---------- Arranque ----------
  if (!S.perfil) $('#ingreso').hidden = false;
  irInicio();
  // Mientras corre la animación de entrada, el inicio aparece primero en "esqueleto" y luego con el contenido
  var real = $('#hoja').innerHTML;
  $('#hoja').innerHTML = '<div class="asa"></div><div class="esq" style="height:22px;width:55%;margin:4px 0 14px"></div><div class="esq" style="height:54px;border-radius:999px;margin-bottom:12px"></div>' +
    '<div style="display:flex;gap:10px;margin-bottom:12px"><div class="esq" style="height:42px;width:130px;border-radius:999px"></div><div class="esq" style="height:42px;width:150px;border-radius:999px"></div></div>' +
    '<div class="esq" style="height:46px;margin-bottom:10px"></div><div class="esq" style="height:46px;margin-bottom:10px"></div><div class="esq" style="height:70px;border-radius:18px"></div>';
  setTimeout(function () { if (S.fase === 'inicio' && !S.fijando) $('#hoja').innerHTML = real; }, 3400);
  setTimeout(function () { var sp = $('#splash'); if (sp) sp.remove(); }, 3200);
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(function (p) {
    var lat = p.coords.latitude, lng = p.coords.longitude;
    if (Math.abs(lat - CENTRO[0]) > 0.6 || Math.abs(lng - CENTRO[1]) > 0.6) return;   // fuera de Guayaquil: se queda la de prueba
    S.yo = { lat: lat, lng: lng, nombre: 'Tu ubicación' }; poner(yo, S.yo);
    if (S.fase === 'inicio') { S.recogida = { lat: lat, lng: lng, nombre: 'Tu ubicación' }; encuadrar([S.yo], 15.3); carrosCerca(true); }
    nombreDe(lat, lng).then(function (n) { S.yo.nombre = n; if (S.fase === 'inicio') S.recogida.nombre = n; });
  }, function () {}, { enableHighAccuracy: true, timeout: 8000 });
})();
</script>
